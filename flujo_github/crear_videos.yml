name: Crear videos

# Se ejecuta:
#  - a mano: pestaña "Actions" -> "Crear videos" -> "Run workflow"
#  - solo, cuando subes o cambias una historia (crea solo esos videos)
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: "Qué videos crear"
        type: choice
        options: [cortos, largos, todos, youtube, diario, shorts]
        default: cortos
      filtro:
        description: "Opcional: solo historias que contengan este texto (ej: 30s, noe, 05_)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      lista: ${{ steps.lista.outputs.lista }}
      cantidad: ${{ steps.lista.outputs.cantidad }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: lista
        env:
          EVENTO: ${{ github.event_name }}
          CARPETA: ${{ github.event.inputs.carpeta }}
          FILTRO: ${{ github.event.inputs.filtro }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, glob
          if os.environ["EVENTO"] == "push":
              out = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout
              archivos = [f for f in out.split() if f.endswith(".json") and f.startswith(("historias/", "historias_cortas/")) and os.path.exists(f)]
          else:
              c = os.environ.get("CARPETA") or "cortos"
              dirs = {"cortos": ["historias_cortas"], "largos": ["historias"], "todos": ["historias", "historias_cortas"],
                      "youtube": ["historias_youtube"], "diario": ["historias_largas"], "shorts": ["historias_shorts"]}[c]
              archivos = sorted(f for d in dirs for f in glob.glob(f"{d}/*.json"))
              filtro = (os.environ.get("FILTRO") or "").strip().lower()
              if filtro:
                  partes = [x.strip() for x in filtro.split(",") if x.strip()]
                  archivos = [f for f in archivos if any(x in f.lower() for x in partes)]
          archivos = archivos[:250]
          with open(os.environ["GITHUB_OUTPUT"], "a") as g:
              g.write("lista=" + json.dumps(archivos) + "\n")
              g.write(f"cantidad={len(archivos)}\n")
          print(f"{len(archivos)} video(s):", *archivos, sep="\n  ")
          PY

  video:
    needs: preparar
    if: needs.preparar.outputs.cantidad != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        archivo: ${{ fromJson(needs.preparar.outputs.lista) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - name: Instalar librerías
        run: pip install -r requirements.txt
      - name: Recuperar voces guardadas
        uses: actions/cache@v4
        with:
          path: voces
          key: voces-piper-v1
      - name: Crear video
        run: |
          python animador.py "${{ matrix.archivo }}" --salida salida --partes $(nproc)
          case "${{ matrix.archivo }}" in historias_largas/*) python miniatura.py "${{ matrix.archivo }}" salida ;; esac
      - name: Nombre del paquete
        id: nombre
        run: echo "n=$(basename '${{ matrix.archivo }}' .json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ steps.nombre.outputs.n }}
          path: |
            salida/*.mp4
            salida/*_portada.png
            salida/*_miniatura.jpg
            salida/*_capitulos.txt
          retention-days: 1

  juntar:
    needs: video
    if: always() && needs.video.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: video-*
          merge-multiple: true
          path: videos
      - name: Armar recopilaciones para YouTube
        if: github.event.inputs.carpeta == 'youtube' || github.event.inputs.carpeta == 'diario'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          pip install -q pillow
          git clone -q --depth 1 "https://github.com/${{ github.repository }}" codigo
          python codigo/recopilar.py videos
          echo "${{ github.event.inputs.carpeta }}" > videos/_youtube.txt
      - name: Dejar los videos del dia listos para subir a YouTube (rama "publicar")
        if: github.event.inputs.carpeta == 'diario' || github.event.inputs.carpeta == 'shorts'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAMA: ${{ github.event.inputs.carpeta == 'shorts' && 'publicar_shorts' || 'publicar' }}
        run: |
          python3 - <<'EOF'
          import json, os, re, shutil, subprocess, unicodedata
          from pathlib import Path
          src, pub = Path("videos"), Path("pub")
          pub.mkdir()
          lista = []
          for f in sorted(src.glob("*.mp4")):
              base = f.stem
              slug = unicodedata.normalize("NFKD", base).encode("ascii", "ignore").decode()
              slug = re.sub(r"[^A-Za-z0-9_-]+", "_", slug).strip("_")
              d = pub / slug
              d.mkdir()
              subprocess.run(["split", "-b", "45m", "-d", "-a", "2", str(f), str(d / "parte_")], check=True)
              partes = sorted(p.name for p in d.iterdir())
              mini = src / f"{base}_miniatura.jpg"
              if mini.exists():
                  shutil.copy(mini, d / "miniatura.jpg")
              desc = src / f"{base}_descripcion.txt"
              lista.append({"video": base, "carpeta": slug, "archivo": f.name, "bytes": f.stat().st_size,
                            "partes": partes, "miniatura": "miniatura.jpg" if mini.exists() else None,
                            "descripcion": desc.read_text(encoding="utf-8") if desc.exists() else ""})
          (pub / "lista.json").write_text(json.dumps(lista, ensure_ascii=False, indent=1), encoding="utf-8")
          print(json.dumps([[x["video"], len(x["partes"])] for x in lista], ensure_ascii=False))
          EOF
          cd pub
          git init -q -b "$RAMA"
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Videos listos para subir"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${{ github.repository }}" "$RAMA"
      - run: ls -la videos
      - uses: actions/upload-artifact@v4
        with:
          name: TODOS_LOS_VIDEOS
          path: videos
          retention-days: 30
